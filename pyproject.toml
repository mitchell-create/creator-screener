[project]
name = "affiliate-pipeline"
version = "0.1.0"
description = "TikTok affiliate video quality analyzer - automated screening of creator production quality"
requires-python = ">=3.11"
dependencies = [
    # Video downloading
    "yt-dlp>=2024.12.0",

    # Audio analysis (Tier 1)
    "speechmos>=0.0.1",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "onnxruntime>=1.16.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",

    # Video analysis (Tier 2)
    "pyiqa>=0.1.12",
    "scenedetect[opencv]>=0.6.2",
    "decord>=0.6.0",

    # Frame extraction & media processing
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",

    # API calls (Tier 3 - OpenRouter/Gemini)
    "httpx>=0.25.0",

    # Data handling
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
tiktok = [
    # Optional: TikTokApi for richer metadata (fallback)
    "TikTokApi>=7.3.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
]
slack = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
]

[project.scripts]
affiliate-pipeline = "src.main:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network/real APIs (deselect with '-m \"not integration\"')",
]
